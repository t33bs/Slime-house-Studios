name: Build Desktop Pet Suite Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop_pet_suite.py'
      - 'studio/creature_rig.py'
      - 'studio/pet_suite_*.py'
      - '.github/workflows/build-desktop-pet-suite.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name SlimeHouseDesktopPetSuite desktop_pet_suite.py
      - uses: actions/upload-artifact@v4
        with:
          name: SlimeHouseDesktopPetSuite-Windows-EXE
          path: dist/SlimeHouseDesktopPetSuite.exe
          if-no-files-found: error
