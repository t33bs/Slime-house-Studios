
name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run automated tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -q

      - name: Build Slime House Studios EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SlimeHouseStudios --icon assets/slime_house_studios.ico --add-data "assets;assets" --collect-all PySide6 main.py
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc "installer.iss"
          } else {
            Write-Host "Inno Setup is not installed; skipping installer."
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SlimeHouseStudios-Windows-Phase1-Test
          path: dist/SlimeHouseStudios.exe
          if-no-files-found: error
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SlimeHouseStudios-Windows-Phase1-Test
          path: dist/SlimeHouseStudios.exe
          if-no-files-found: error
